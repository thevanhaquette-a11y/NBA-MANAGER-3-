/* Layout : en-tête type tableau de score + onglets ; contenu en cartes et tableaux denses. */
:root{
  --bg:#EDEFF3; --panel:#FFFFFF; --soft:#F3F5F9; --ink:#101827; --muted:#5B6577; --line:#D8DCE4;
  --accent:#D9480F; --accent-ink:#FFFFFF; --good:#12805C; --bad:#C2301E; --warn:#9A5B00; --hl:#FFEFE4;

  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --panel:#131C2E; --soft:#0F1727; --ink:#E8ECF4; --muted:#9AA6BD; --line:#25324A;
  --accent:#FF8A4C; --accent-ink:#1A0E05; --good:#3DD6A0; --bad:#FF7A6B; --warn:#F2B24C; --hl:#3A2A22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --panel:#131C2E; --soft:#0F1727; --ink:#E8ECF4; --muted:#9AA6BD; --line:#25324A;
  --accent:#FF8A4C; --accent-ink:#1A0E05; --good:#3DD6A0; --bad:#FF7A6B; --warn:#F2B24C; --hl:#3A2A22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.02em;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:16px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
h4{font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--team,var(--accent));border-radius:10px;padding:14px 16px}
.top .id{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.top .id h1{font-size:30px;line-height:1;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:13px}
.score{display:flex;gap:22px;align-items:flex-end}
.score div{display:flex;flex-direction:column;align-items:flex-start}
.score b{font-family:var(--display);font-size:34px;line-height:1;font-weight:800}
.score span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tb{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 7px;border-radius:5px;background:var(--c);color:var(--t);
  font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.tb.lg{min-width:52px;height:38px;font-size:21px;border-radius:7px}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.full{grid-column:1/-1}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--soft);padding:9px 14px;border-radius:7px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--hl)}
tr.cut td{border-top:2px dashed var(--muted)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;min-width:22px;text-align:center;padding:1px 6px;border-radius:4px;font-weight:700;font-size:12px;color:#fff}
.pill.w{background:var(--good)} .pill.l{background:var(--bad)}
:root[data-theme="dark"] .pill{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#0B1220}}
.ovr{font-family:var(--display);font-weight:800;font-size:18px}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.next .vs{font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;line-height:1.05}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .grow{flex:1 1 120px;min-width:0}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:100%}
.note{font-size:12px;color:var(--muted)}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.err{background:var(--warn)}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.pick:hover{border-color:var(--accent)}
.pick .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick > div{min-width:0}
.hero{display:flex;flex-direction:column;gap:6px;max-width:62ch}
.hero h1{font-size:44px;line-height:.95;text-transform:uppercase}

input[type=range]{accent-color:var(--accent);width:100%;min-width:130px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.chk:last-child{border-bottom:0}
.chk.on{background:var(--hl)}
.chk .pn{white-space:normal;overflow:visible;line-height:1.25}.chk .pn b,.chk .pn span{display:block}.chk .pn span{font-size:12px}.chk .tc{flex:none;text-align:right}.tc-o{width:42px}.tc-o .ovr{font-size:22px}.tc-p{width:34px}.tc-s{width:76px;display:flex;flex-direction:column;line-height:1.2}.tc-s b{font-size:14px}.tc-s i{font-style:normal;font-size:11px}.chk.hd{cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-bottom:4px}.chk.hd .tc-s{display:block}.chk .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verdict{border-left:4px solid var(--muted);padding:8px 12px;background:var(--soft);border-radius:0 7px 7px 0}
.verdict.ok{border-color:var(--good)} .verdict.mid{border-color:var(--warn)} .verdict.no{border-color:var(--bad)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

.bracket{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px;min-width:520px}
.rc{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.ser{border:1px solid var(--line);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;background:var(--soft)}
.ser.me{border-color:var(--accent);background:var(--hl)}
.ser.ph{color:var(--muted);font-size:12px;text-align:center;padding:14px 8px}
.ser .sr{display:flex;align-items:center;gap:8px}
.ser .sr b{margin-left:auto;font-family:var(--display);font-size:20px}
.ser .sr.win b{color:var(--good)}
.ser .sr:not(.win) .tb{opacity:.9}
.ser .sd{font-size:11px}
.ser.done .sr:not(.win){opacity:.55}
@media (max-width:520px){.top .id h1{font-size:24px}.score b{font-size:28px}.hero h1{font-size:36px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s,filter .15s}}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{padding:7px 12px;background:var(--soft);border:0;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input#mgrName{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink);font:inherit;max-width:280px}
.live{position:fixed;inset:0;background:rgba(5,10,20,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
.lv-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.lv-top{display:flex;align-items:center;justify-content:center;gap:16px}
.lv-sc{font-family:var(--display);font-size:52px;line-height:1}
.lv-mid{display:flex;justify-content:center;gap:12px;align-items:baseline;font-size:18px}
.lv-bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}.lv-bar i{display:block;height:100%;background:var(--accent)}
.lv-body{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.lv-feed{display:flex;flex-direction:column;gap:5px;min-height:150px;font-size:13px}.lv-feed .q{color:var(--accent);font-weight:700}
.lv-side{display:flex;flex-direction:column;gap:4px;font-size:13px}
.lv-ctl{justify-content:center}

.lv-box.wide{width:min(1000px,100%)}
.tw{overflow-x:auto}
table.bx{width:100%;border-collapse:collapse;font-size:12px}
table.bx th,table.bx td{padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.bx th{color:var(--muted);font-weight:600;text-align:left}
table.bx .r,table.bx th.r{text-align:right}
table.bx tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.lv-final h4{margin:10px 0 4px}
.lv-feed{max-height:48vh;overflow:auto}
.lv-feed .q{padding:2px 0}
details.pbp{font-size:13px}
.gr.off{opacity:.45;pointer-events:none}
.pbar{display:inline-block;width:120px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;flex:none}.pbar i{display:block;height:100%}
@media (max-width:620px){.lv-body{grid-template-columns:1fr}.lv-sc{font-size:40px}}
.gr{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.gr.on{background:var(--hl)}.gr.sel{border-color:var(--accent)}.gr .gp{width:12px;color:var(--accent)}
.gr .en{width:44px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:inline-block}.gr .en i{display:block;height:100%}
.gr .num{min-width:26px;text-align:right}
</style>

function buildSchedule(seed){
  const rnd=mulberry32(seed),games=[];
  for(let i=0;i<30;i++)for(let j=i+1;j<30;j++){
    const di=(i/5)|0,dj=(j/5)|0,ci=i<15?0:1,cj=j<15?0:1;
    let n;
    if(ci!==cj)n=2;else if(di===dj)n=4;else{const k=((j%5)-(i%5)+5)%5;n=k<=2?4:3}
    const first=(i+j)%2===0;
    for(let g=0;g<n;g++){const home=(g%2===0)?(first?i:j):(first?j:i);games.push([home,home===i?j:i])}
  }
  const need=new Array(30).fill(0);games.forEach(([h,a])=>{need[h]++;need[a]++});
  let rem=games.map((_,k)=>k);const days=[];
  while(rem.length){

    const keyed=rem.map(gi=>[need[games[gi][0]]+need[games[gi][1]]+rnd()*1.5,gi]).sort((a,b)=>b[0]-a[0]);
    for(const [,gi] of keyed){

  }

}

/* ---------- Stratégies d'entraîneur : profil d'équipe et adéquation ---------- */
// Attaque : "S" jeu autour de la star, "C" jeu collectif, "I" jeu intérieur. Défense : "M" homme à homme, "Z" zone, "D" double-équipe sur la star.
// "N" = pas de consigne particulière (comportement neutre).
const compOf=r=>{const sc=Math.max(r.three,r.mid,.65*r.close+.35*r.dunk)*.6+((r.three+r.mid+r.close)/3)*.4;return .55*sc+.25*r.iq+.2*r.handle};

  const top=L.filter(x=>x.tg>0).sort((a,b)=>b.tg-a.tg).slice(0,9);
  if(top.length<5)return null;
  const W=top.reduce((a,x)=>a+x.tg,0),av=f=>top.reduce((a,x)=>a+x.tg*f(x.r),0)/W;
  const cs=top.map(x=>compOf(x.r)).sort((a,b)=>b-a);
  const bigs=top.slice().sort((a,b)=>(b.r.intD+b.r.block)-(a.r.intD+a.r.block));
  return {
    star:cs[0]-(cs[1]+cs[2]+cs[3]+cs[4])/4,
    shoot:av(r=>.5*r.three+.3*r.mid+.2*r.ft),
    pass:av(r=>.5*r.pass+.3*r.iq+.2*r.handle),
    inside:av(r=>.45*r.close+.3*r.dunk+.25*r.str),
    perim:av(r=>.6*r.perD+.2*r.steal+.2*r.speed),
    rim:(bigs[0].r.intD*.6+bigs[0].r.block*.4)*.6+((bigs[0].r.intD+bigs[1].r.intD)/2)*.4,
    help:av(r=>.5*r.iq+.25*r.perD+.25*r.speed)

}
// moyennes et écarts de la ligue (calibrés sur les 30 équipes)
const PMU={star:7.04,shoot:78.84,pass:79.32,inside:80.5,perim:79.93,rim:93.44,help:80.71},PSD={star:3.24,shoot:1.88,pass:3.05,inside:1.96,perim:3.65,rim:4.26,help:2.89};
const zf=(pr,k)=>(pr[k]-PMU[k])/PSD[k];
const FITK=.24;
function fitsOf(pr){
  if(!pr)return {S:1,C:1,I:1,M:1,Z:1,D:1};
  const f=z=>clamp(1+FITK*z,.55,1.5);
  return {
    S:f(zf(pr,"star")),
    C:f(.5*zf(pr,"shoot")+.5*zf(pr,"pass")),
    I:f(zf(pr,"inside")),
    M:f(zf(pr,"perim")),
    Z:f(.7*zf(pr,"rim")-.3*zf(pr,"perim")),
    D:f(zf(pr,"help"))
  };
}

// Cycle des stratégies (+1 : l'attaque prend l'avantage, -1 : la défense prend l'avantage). Chaque stratégie en bat une, perd contre une autre, et est neutre contre la troisième.
const EDGE={S:{M:0,Z:1,D:-1},C:{M:-1,Z:0,D:1},I:{M:1,Z:-1,D:0}};
const ST_A=.014,ST_B=.025,ST_CAP=.022;
// coût moyen de chaque stratégie, réglé pour qu'aucune ne domine en moyenne (voir t11.js)
const BASE_O={S:-.0008,C:.0095,I:-.0085},BASE_D={M:.0020,Z:.0038,D:-.0070}; // effet maximum sur la réussite aux tirs (environ 3 points par match)
function stratPAdd(o,d,fo,fd,nb){
  let v=0;
  if(EDGE[o]&&EDGE[o][d]!==undefined){const e=EDGE[o][d];v+=e>0?ST_A*fo:(e<0?-ST_A*fd:0)}
  if(EDGE[o])v+=ST_B*(fo-1)+(nb?0:BASE_O[o]);
  if(d==="M"||d==="Z"||d==="D")v-=ST_B*(fd-1)+(nb?0:BASE_D[d]);

}
const OFFX={S:{starW:.55,astAdd:-.04,foulAdd:.008},C:{starW:-.35,astAdd:.06,tovAdd:.003},I:{rimMul:1.22,thrMul:.86,foulAdd:.006}};
const DEFX={Z:{rimMul:.9,thrMul:1.1,tovAdd:-.004},D:{starW:-.45,tovAdd:.010,foulAdd:.004}};
function mkFx(o,d,fo,fd){
  const fx={pAdd:stratPAdd(o,d,fo,fd),starW:0,rimMul:1,thrMul:1,astAdd:0,foulAdd:0,tovAdd:0};
  [OFFX[o],DEFX[d]].forEach(x=>{if(!x)return;for(const k in x){if(k==="rimMul"||k==="thrMul")fx[k]*=x[k];else fx[k]+=x[k]}});

/* ---------- 2. Utilitaires de tirage ---------- */
function pickW(rnd,list,wf,excl){
  let tot=0;const w=new Array(list.length);
  for(let i=0;i<list.length;i++){const x=list[i];w[i]=x===excl?0:wf(x);tot+=w[i]}
  let v=rnd()*tot;
  for(let i=0;i<list.length;i++){v-=w[i];if(v<=0&&w[i]>0)return list[i]}
  for(let i=list.length-1;i>=0;i--)if(w[i]>0)return list[i];
  return list[0];
}
const lastName=n=>{const a=n.split(" ");return a.length>1?a.slice(1).join(" "):n};

/* ---------- 3. Équipe et joueur de simulation ---------- */
function mkPlayer(x,idx){
  const p=x.p,r=ratingsOf(p);
  return {p,idx,n:p.n,pos:p.p,o:p.o,r,tg:x.tg||0,e:100,f:Math.min(70,p.f||0),sec:0,on:false,out:false,hurt:0,inT:0,outT:0,
    pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,drb:0,ast:0,stl:0,blk:0,tov:0,pf:0,pm:0};
}
function mkTeam(side,cfg){
  const T={side,luck:0,name:cfg.name||"",tac:Object.assign({pace:0,three:0,press:0},cfg.tac||{}),auto:cfg.auto!==false,
    pl:cfg.L.map((x,i)=>mkPlayer(x,i)),on:[],score:0,fouls:0,to:7,run:0,lastTO:-999,qs:[]};
  return T;
}

/* ---------- 4. Le match ---------- */
function Game(cfg){
  this.r=cfg.rnd||Math.random;
  this.po=!!cfg.po;this.log=!!cfg.log;this.ev=this.log?[]:null;
  this.tm=[mkTeam(0,cfg.home),mkTeam(1,cfg.away)];
  this.q=1;this.clock=720;this.t=0;this.reg=2880;this.done=false;this.fast=false;
  this.subWin=true;this.inj=[];this.ot=0;this.poss=0;this.tip=0;
  this.hc=cfg.noHome?0:1;

}
const GP=Game.prototype;
GP.setupStrat=function(){
  const pr=this.tm.map(T=>rawProfile(T.pl.map(x=>({r:x.r,pos:x.pos,tg:x.tg})))),fits=pr.map(fitsOf);
  for(let s=0;s<2;s++){
    const O=this.tm[s],o=O.tac.off||"N",d=this.tm[1-s].tac.def||"N";
    O.fx=mkFx(o,d,o==="N"?1:fits[s][o],d==="N"?1:fits[1-s][d]);
    O.pl.forEach(x=>x.sr=0);
    O.pl.filter(x=>x.tg>0).sort((a,b)=>compOf(b.r)-compOf(a.r)).slice(0,2).forEach((x,i)=>x.sr=i?.5:1);
  }

};
GP.emit=function(o){if(!this.ev)return;o.t=Math.round(this.t);o.q=this.q;o.c=Math.max(0,Math.round(this.clock));o.sc=[this.tm[0].score,this.tm[1].score];this.ev.push(o)};

GP.tipOff=function(){
  const r=this.r;
  this.tip=r()<.5?0:1;this.poss=this.tip;
  this.arrow=1-this.tip; // Q2 y Q3 para el que perdió el salto
};

/* efectivos (con fatiga) */
// compression des écarts de compétence autour de 66 : resserre les bilans et les moyennes des stars
const CMP_A=(typeof process!=="undefined"&&process.env&&process.env.CMPA)?+process.env.CMPA:1;
const CMP_B=(typeof process!=="undefined"&&process.env&&process.env.CMPB)?+process.env.CMPB:1;
const CMPK={close:1,dunk:1,mid:1,three:1,ft:1,pass:1,handle:1,iq:1};
GP.E=function(sp,k){return 66+(sp.r[k]-66)*(CMPK[k]?CMP_A:CMP_B)-(100-sp.e)*.11-sp.f*.12-(sp.pf>=5?1.2:0)};

/* Quinteto inicial y remplazos */
GP.pickStarters=function(T){
  const pool=T.pl.filter(x=>!x.out).slice().sort((a,b)=>(b.tg-a.tg)||(b.o-a.o));
  let five=pool.slice(0,5);
  five=this.fixLineup(T,five,pool);
  T.on=five;five.forEach(x=>{x.on=true;x.inT=0});
};
function isHandler(x){return x.pos==="PG"||x.r.handle>=72}
function isBig(x){return x.pos==="C"||x.pos==="PF"}
GP.fixLineup=function(T,five,pool){
  five=five.slice();
  const rest=pool.filter(x=>five.indexOf(x)<0);
  const need=(pred,minN)=>{
    let n=five.filter(pred).length;
    while(n<minN){
      const cand=rest.filter(pred)[0];if(!cand)break;
      // sustituye al peor de los que no cumplen y no son imprescindibles
      let worst=null;for(const x of five){if(!pred(x)&&(!worst||this.val(T,x)<this.val(T,worst)))worst=x}
      if(!worst)break;
      five[five.indexOf(worst)]=cand;rest.splice(rest.indexOf(cand),1);rest.push(worst);n++;
    }
  };
  need(isHandler,1);need(isBig,1);

/* "valeur" d'un joueur pour jouer maintenant (plan de minutes + fatiga + fautes) */
GP.val=function(T,x){
  const f=Math.min(1,this.t/this.reg);
  const owed=(x.tg*60*f-x.sec)/60;
  let v=owed+(x.e-72)*.05+(x.o-70)*.05-x.f*.03;
  if(this.garbage)v=(x.tg<18?(24-x.tg)*.25:-(x.tg-18)*.5)+(x.e-72)*.03;
  v+=x.on?3.4:0;
  if(!x.on&&this.t-x.outT<90)v-=1.2;
  if(x.on&&this.t-x.inT<150)v+=1.5;
  const lim=this.q===1?2:(this.q===2?3:(this.q===3?4:5));
  if(x.pf>lim&&this.q<=4)v-=2.5*(x.pf-lim);
  if(x.pf>=5)v-=5;
  if(x.tg===0&&!this.garbage)v-=3;
  return v;
};
GP.doSubs=function(T){
  if(!T.auto)return;
  const pool=T.pl.filter(x=>!x.out&&!x.hurt);
  const sorted=pool.slice().sort((a,b)=>this.val(T,b)-this.val(T,a));
  let five=sorted.slice(0,5);
  five=this.fixLineup(T,five,sorted);
  this.applyLineup(T,five);
};
GP.applyLineup=function(T,five){
  const cur=T.on,ins=five.filter(x=>cur.indexOf(x)<0),outs=cur.filter(x=>five.indexOf(x)<0);
  for(let i=0;i<ins.length;i++){
    const a=ins[i],b=outs[i];if(!b)break;
    a.on=true;a.inT=this.t;b.on=false;b.outT=this.t;
    this.emit({k:"sub",s:T.side,a:a.n,b:b.n});
  }
  T.on=cur.filter(x=>x.on).concat(ins.filter(x=>x.on&&cur.indexOf(x)<0));
  // si faltan jugadores (lesión sin relevo) rellena
  while(T.on.length<5){const c=T.pl.filter(x=>!x.on&&!x.out&&!x.hurt)[0]||T.pl.filter(x=>!x.on&&!x.hurt)[0];if(!c)break;c.on=true;c.inT=this.t;T.on.push(c)}
  while(T.on.length>5){const x=T.on.pop();x.on=false}

/* Cambio manual (el entrenador humano) */
GP.swap=function(side,outIdx,inIdx){
  const T=this.tm[side],o=T.pl[outIdx],i=T.pl[inIdx];
  if(!o||!i||!o.on||i.on||i.out||i.hurt)return false;
  i.on=true;i.inT=this.t;o.on=false;o.outT=this.t;
  T.on[T.on.indexOf(o)]=i;
  this.emit({k:"sub",s:side,a:i.n,b:o.n});
  return true;
};

/* ---------- 5. Reloj, energía, puntos ---------- */
GP.advance=function(d){
  d=Math.min(d,this.clock);
  this.clock-=d;this.t+=d;
  const press0=this.tm[0].tac.press,press1=this.tm[1].tac.press;
  for(let s=0;s<2;s++){
    const T=this.tm[s],press=s===0?press0:press1;
    for(const x of T.pl){
      if(x.on){
        x.sec+=d;
        x.e=Math.max(0,x.e-d*.054*(1.55-x.r.stam*.01)*(1+.12*press));
      }else x.e=Math.min(100,x.e+d*.062);
    }
  }
  return d;
};
GP.score=function(T,pts){
  const O=T,D=this.tm[1-T.side];
  O.score+=pts;O.run+=pts;D.run=0;
  for(const x of O.on)x.pm+=pts;
  for(const x of D.on)x.pm-=pts;
};
GP.teamAvg=function(T,k){let s=0;for(const x of T.on)s+=this.E(x,k);return s/T.on.length};

/* ---------- 6. Bucle principal ---------- */
GP.step=function(){
  if(this.done)return;
  if(this.clock<=.01){this.endPeriod();return}
  const diff=Math.abs(this.tm[0].score-this.tm[1].score);
  this.garbage=(this.q===4&&this.clock<=420&&diff>=20)||(this.q>=3&&this.clock<=300&&diff>=26)||(this.q===4&&this.clock<=720&&diff>=32);
  if(this.q>=4&&this.clock<=300&&diff<=10)this.garbage=false;
  // tiempos muertos de la IA
  this.maybeTimeout();
  if(this.subWin||this.r()<.22){this.tm.forEach(T=>this.doSubs(T));this.subWin=false}
  this.play();
  if(this.clock<=.01&&!this.done){/* el cierre se gestiona al siguiente paso */}
};
GP.runToEnd=function(){let g=0;while(!this.done&&g++<2500)this.step()};
GP.maybeTimeout=function(){
  const r=this.r;

    const T=this.tm[s];
    if(!T.auto&&s===this.humanSide)continue;
    if(T.to<=0||this.t-T.lastTO<150)continue;
    const D=this.tm[1-s],lt=this.q>=4&&this.clock<=240;
    if(D.run>=10&&r()<.55||(lt&&D.run>=7&&r()<.3)||(this.q>=4&&this.clock<=40&&T.score<D.score&&T.score>=D.score-8&&this.poss===s&&r()<.2))this.callTimeout(s);
  }

GP.callTimeout=function(s){
  const T=this.tm[s];if(T.to<=0)return false;
  T.to--;T.lastTO=this.t;T.run=0;this.tm[1-s].run=0;
  for(const x of this.tm[0].pl.concat(this.tm[1].pl))if(x.on)x.e=Math.min(100,x.e+3);
  this.subWin=true;
  this.emit({k:"to_call",s});
  return true;
};
GP.endPeriod=function(){
  const q=this.q;
  this.tm.forEach(T=>T.qs.push(T.score));
  this.emit({k:"q",v:q});
  const A=this.tm[0].score,B=this.tm[1].score;
  if(q>=4&&A===B&&this.ot>=6){const T=this.tm[this.r()<.5?0:1];T.score++;T.qs[T.qs.length-1]++;}
  if(q>=4&&this.tm[0].score!==this.tm[1].score){this.done=true;this.emit({k:"end"});return}
  if(q>=4){this.ot++;this.q++;this.clock=300;this.reg+=300;this.tm.forEach(T=>{T.fouls=0});this.poss=this.r()<.5?0:1;
    for(const x of this.tm[0].pl.concat(this.tm[1].pl))x.e=Math.min(100,x.e+10);
    this.subWin=true;this.fast=false;this.emit({k:"ot",v:this.ot});return}
  this.q++;this.clock=720;this.tm.forEach(T=>{T.fouls=0});
  const rec=q===2?24:9;
  for(const x of this.tm[0].pl.concat(this.tm[1].pl))x.e=Math.min(100,x.e+rec);
  this.poss=(q===1||q===2)?this.arrow:this.tip; // Q2,Q3: perdedor del salto; Q4: ganador
  this.subWin=true;this.fast=false;
};

/* ---------- 7. Una posesión ---------- */
GP.possDur=function(O,D,fast,diff){
  const r=this.r;
  let d=fast?4+r()*5:6+16*Math.pow(r(),.9);
  const sp=(this.teamAvg(O,"speed")+this.teamAvg(D,"speed"))/2;
  d*=1-(sp-65)*.0023;
  d*=1-.08*O.tac.pace-.035*D.tac.pace;
  const clk=this.clock,late=this.q>=4;
  if(late&&clk<=200&&diff>0&&diff<=15)d=Math.max(d,Math.min(23,14+r()*9));
  if(late&&clk<=150&&diff<0&&diff>=-14)d=Math.min(d,5+r()*8);

};
GP.play=function(){

  const diff=O.score-D.score;
  let fast=this.fast;this.fast=false;
  this.possN[O.side]++;

  /* Faltas intencionadas al final (el que va perdiendo) */
  if(this.q>=4){
    const lim=this.clock<=24?9:(this.clock<=45?7:(this.clock<=75?5:0));
    if(diff>0&&diff<=lim&&this.clock>1.5&&r()<.9){this.intentional(O,D);return}
  }

  const dur0=this.possDur(O,D,fast,diff);
  let again=true,first=true,dur=dur0;

  while(again&&guard++<6){
    again=false;
    if(this.clock<=.01)break;
    const buzzer=dur>=this.clock-.01;
    dur=Math.min(dur,this.clock);
    this.advance(dur);
    // lesiones en pista
    this.injuryCheck(O,D,dur);
    // falta no de tiro previa
    if(first&&r()<.086){
      const res=this.looseFoul(O,D);

    }

      const to=this.turnover(O,D,fast,dur);
      if(to){this.poss=D.side;if(to==="steal"&&r()<.52)this.fast=true;this.subWin=this.subWin||r()<.55;return}
    }
    const res=this.shot(O,D,{fast,buzzer,dur,first,late:this.q>=4&&this.clock<=300&&Math.abs(diff)<=6});
    if(res==="oreb"){again=true;first=false;fast=false;dur=3+r()*6;continue}
    if(res==="hold")return; // la posesión sigue (fin de cuarto)
    this.poss=D.side;
    if(res==="dead"||r()<.28)this.subWin=true;

};

/* Falta intencionada */
GP.intentional=function(O,D){
  const r=this.r,d=Math.min(this.clock,1.2+r()*2.6);
  this.advance(d);
  const fouled=pickW(r,O.on,x=>Math.exp((this.E(x,"handle")+x.r.dx-60)/22)),fouler=pickW(r,D.on,x=>1+(x.pf<5?1.2:0));
  this.addFoul(fouler,D,"int",fouled);

  if(!bonus)return; // saque de banda; la posesión sigue
  const last=this.freeThrows(fouled,O,2,fouler);

GP.afterFTMiss=function(O,D){

  const off=this.rebound(O,D,true);
  if(off){this.poss=O.side;this.fast=false}else this.poss=D.side;

/* ---------- 8. Faltas ---------- */
GP.addFoul=function(sp,T,kind,fouled){
  sp.pf++;T.fouls++;
  this.emit({k:"foul",s:T.side,a:sp.n,b:fouled?fouled.n:null,x:kind,v:sp.pf});
  if(sp.pf>=6){
    sp.out=true;sp.on=false;sp.outT=this.t;
    this.emit({k:"fout",s:T.side,a:sp.n});
    const i=T.on.indexOf(sp);if(i>=0){T.on.splice(i,1);
      const c=T.pl.filter(x=>!x.on&&!x.out&&!x.hurt).sort((a,b)=>this.val(T,b)-this.val(T,a))[0];
      if(c){c.on=true;c.inT=this.t;T.on.push(c);this.emit({k:"sub",s:T.side,a:c.n,b:sp.n})}}
  }
  this.subWin=true;
};
GP.looseFoul=function(O,D){
  const r=this.r;
  const fouler=pickW(r,D.on,x=>(1+Math.max(0,70-x.r.iq)*.02)*(x.pf>=5?.5:1)*(1+.12*D.tac.press));
  const fouled=pickW(r,O.on,x=>Math.exp((this.E(x,"handle")+x.r.dx-60)/25));
  this.addFoul(fouler,D,"loose",fouled);
  const bonus=D.fouls>=5||(this.clock<=120&&D.fouls>=4);
  if(!bonus)return "go";
  const last=this.freeThrows(fouled,O,2,fouler);
  if(last.made)this.poss=D.side;else this.afterFTMiss(O,D);
  return "done";
};

/* ---------- 9. Lanzamientos libres ---------- */
GP.freeThrows=function(sp,T,n,fouler){
  const r=this.r;let made=false;
  for(let i=1;i<=n;i++){
    let p=FTB+this.E(sp,"ft")*.0068;
    if(this.q>=4&&this.clock<=240)p+=(sp.r.clutch-65)*.0008;
    p=clamp(p,.3,.95);
    sp.fta++;made=r()<p;
    if(made){sp.ftm++;sp.pts++;this.score(T,1)}
    this.emit({k:"ft",s:T.side,a:sp.n,v:made?1:0,n:i,m:n});
  }
  this.subWin=true;
  return {made};
};

/* ---------- 10. Pérdidas ---------- */
GP.turnover=function(O,D,fast,dur){
  const r=this.r;
  const hnd=pickW(r,O.on,x=>Math.exp((this.E(x,"handle")+this.E(x,"pass")-130)/36)*(isHandler(x)?1.4:1));
  let p=TOVB+(66-this.E(hnd,"handle")*.6-this.E(hnd,"iq")*.4)*.0022+(this.teamAvg(D,"steal")-62)*.0011+D.tac.press*.014+(O.tac.pace>0?O.tac.pace*.008:0);
  p-=hnd.r.hx*.0012;p+=O.fx.tovAdd;

  const kind=r()<.56?"steal":(r()<.18?"off":"bad");
  if(kind==="steal"){
    const st=pickW(r,D.on,x=>Math.exp((this.E(x,"steal")-60)/16)*(x===hnd?0:1));
    st.stl++;
    this.emit({k:"to",s:O.side,a:hnd.n,b:st.n,x:"steal"});

  }
  if(kind==="off"){
    const fo=pickW(r,D.on,x=>1);
    this.emit({k:"to",s:O.side,a:hnd.n,x:"off"});
    hnd.pf++;O.fouls++;this.emit({k:"foul",s:O.side,a:hnd.n,x:"off",v:hnd.pf});
    if(hnd.pf>=6){hnd.out=true;hnd.on=false;hnd.outT=this.t;this.emit({k:"fout",s:O.side,a:hnd.n});
      const i=O.on.indexOf(hnd);if(i>=0){O.on.splice(i,1);const c=O.pl.filter(x=>!x.on&&!x.out&&!x.hurt).sort((a,b)=>this.val(O,b)-this.val(O,a))[0];if(c){c.on=true;c.inT=this.t;O.on.push(c);this.emit({k:"sub",s:O.side,a:c.n,b:hnd.n})}}}
    this.subWin=true;

  }

/* ---------- 11. Lanzamiento ---------- */
const KS=.56;
const PARK=(typeof process!=='undefined'&&process.env&&process.env.PARK)?+process.env.PARK:0; // parité : réduit légèrement l'avantage de l'équipe la plus forte
const USEK=(typeof process!=='undefined'&&process.env&&process.env.USEK)?+process.env.USEK:17;
const PADJ=(typeof process!=='undefined'&&process.env&&process.env.PADJ)?+process.env.PADJ:-.012;
const TOVB=(typeof process!=='undefined'&&process.env&&process.env.TOVB)?+process.env.TOVB:.172;
const FTB=(typeof process!=='undefined'&&process.env&&process.env.FTB)?+process.env.FTB:.245;
const DAMP=(typeof process!=="undefined"&&process.env&&process.env.DAMP)?+process.env.DAMP:.004; // régression vers la moyenne de la réussite d'équipe (réduit la variance excessive d'un match) // sensibilité globale talent -> acierto (calibrada)
const RIM_SUB=["dunk","lay","hook","lay"];
GP.shot=function(O,D,c){
  const r=this.r,E=(x,k)=>this.E(x,k);
  const fast=c.fast;
  // tirador por uso
  const uw=x=>{
    const sc=Math.max(E(x,"three"),E(x,"mid"),.65*E(x,"close")+.35*E(x,"dunk"))*.6+((E(x,"three")+E(x,"mid")+E(x,"close"))/3)*.4;
    const comp=.55*sc+.25*E(x,"iq")+.2*E(x,"handle");
    let w=Math.exp((comp-70)/USEK);
    if(c.late)w*=Math.exp((x.r.clutch-70)/55);
    if(fast)w*=1+(E(x,"speed")-65)*.01;
    w*=Math.exp(O.fx.starW*x.sr);
    return Math.max(.02,w);
  };
  const sh=pickW(r,O.on,uw);
  // tipo de tiro
  const t3=1+.2*O.tac.three;
  let wr=.31*Math.exp(((.5*E(sh,"close")+.3*E(sh,"dunk")+.2*E(sh,"str"))-62)/20);
  let wm=.2*Math.exp((E(sh,"mid")-66)/22);
  let w3=.43*Math.exp((E(sh,"three")-68)/19)*t3;
  wr*=O.fx.rimMul;w3*=O.fx.thrMul;
  if(fast){wr*=1.9;w3*=.85;wm*=.4}
  if(c.buzzer&&c.dur<3.5){w3*=3;wr*=.5}
  const tt=wr+wm+w3,u=r()*tt;
  const type=u<wr?"rim":(u<wr+wm?"mid":"three");
  // defensor principal
  const ORD={PG:0,SG:1,SF:2,PF:3,C:4};
  let df;
  if(r()<.62){
    const same=D.on.filter(x=>Math.abs((ORD[x.pos]||2)-(ORD[sh.pos]||2))<=1);
    df=same.length?same[Math.floor(r()*same.length)]:D.on[Math.floor(r()*D.on.length)];
  }else df=D.on[Math.floor(r()*D.on.length)];
  // asistencia previa
  const pA=(type==="rim"?.5:(type==="mid"?.38:.83))+O.fx.astAdd;
  const assisted=!fast&&r()<pA+(this.teamAvg(O,"pass")-65)*.0015||(fast&&r()<.45);
  // probabilidad de acierto
  let p,skill,defv;
  const protector=D.on.reduce((b,x)=>Math.max(b,E(x,"intD")*.6+E(x,"block")*.4),0);
  if(type==="rim"){
    skill=.62*E(sh,"close")+.38*E(sh,"dunk");
    defv=.5*E(df,"intD")+.5*protector;
    p=.565+KS*((skill-71)*.0040-(defv-68)*.0031);
    if(fast)p+=.09;
  }else if(type==="mid"){
    skill=E(sh,"mid");defv=.75*E(df,"perD")+.25*this.teamAvg(D,"perD");
    p=.372+KS*((skill-70)*.0046-(defv-66)*.0030);
  }else{
    skill=E(sh,"three");defv=.7*E(df,"perD")+.3*this.teamAvg(D,"perD");
    p=.322+KS*((skill-70)*.0043-(defv-66)*.0026);
    if(fast)p+=.02;
  }
  p+=assisted?.032:-.02;
  p+=(this.teamAvg(O,"three")-62)*(type==="rim"?.0007:.0003);
  if(O.side===0)p+=.007*this.hc;else p-=.0035*this.hc;
  if(c.late)p+=(sh.r.clutch-68)*.0005;
  if(c.buzzer&&c.dur<3.5)p*=.55;
  p-=D.tac.press*.006;
  p+=O.fx.pAdd;
  if(this.par===undefined){const sc=T=>{let a=0,w=0;for(const x of T.pl){const m=x.tg||0;a+=m*x.r.o;w+=m}return w?a/w:70};this.par=[0,0];const s0=sc(this.tm[0]),s1=sc(this.tm[1]);this.par[0]=-(s0-s1)*PARK;this.par[1]=-(s1-s0)*PARK}
  p+=this.par[O.side];
  p-=DAMP*O.luck;p+=PADJ;
  p=clamp(p,.12,.82);
  // falta en el tiro
  let pF=type==="rim"?.2:(type==="mid"?.068:.033);
  pF+=sh.r.dx*.0007*(type==="rim"?1:.5)+(E(sh,"str")-62)*.0005*(type==="rim"?1:.4)+(65-(E(df,"perD")+E(df,"intD"))/2)*.0006+D.tac.press*.012+O.fx.foulAdd;
  if(fast)pF*=.6;
  pF=clamp(pF,.01,.3);

  O.luck+=((madeRoll?1:0)-p)*(type==="three"?3:2);
  const foul=r()<pF;
  const sub=type==="rim"?(r()<(E(sh,"dunk")-30)/130?"dunk":(r()<.3?"hook":"lay")):(type==="mid"?(r()<.5?"jmp":(r()<.5?"fade":"pull")):(r()<.2?"corner":(r()<.1?"deep":"three")));
  if(foul){
    this.addFoul(df,D,"shoot",sh);
    const nFT=type==="three"?3:2;
    if(madeRoll){
      sh.fga++;sh.fgm++;const pts=type==="three"?3:2;sh.pts+=pts;if(type==="three"){sh.tpa++;sh.tpm++}
      this.score(O,pts);

    const off=this.rebound(O,D,true);
    if(off){return "oreb"}
    return "dead";
  }
  sh.fga++;if(type==="three")sh.tpa++;
  if(madeRoll){
    sh.fgm++;const pts=type==="three"?3:2;sh.pts+=pts;if(type==="three")sh.tpm++;
    this.score(O,pts);
    const ast=assisted?this.credAst(O,sh):null;
    this.emit({k:"fg",s:O.side,a:sh.n,b:ast,v:pts,x:type,y:sub});
    if(this.q>=4&&this.clock<=120)this.subWin=true;
    return "made";
  }
  // fallo: ¿tapón?
  let pB=(type==="rim"?.145:(type==="mid"?.04:.012));
  const avgBlk=D.on.reduce((a,x)=>a+E(x,"block"),0)/D.on.length;
  pB*=clamp(Math.exp((avgBlk-52)/22),.45,2.1);
  let blk=null;
  if(r()<pB){blk=pickW(r,D.on,x=>Math.exp((E(x,"block")-58)/14));if(blk)blk.blk++}
  if(this.clock<=.01){this.emit({k:"miss",s:O.side,a:sh.n,b:blk?blk.n:null,x:type,y:sub,rb:"t"});return "dead"}
  // rebote
  const rbEv={k:"miss",s:O.side,a:sh.n,b:blk?blk.n:null,x:type,y:sub};
  const rr=this.reboundDetail(O,D,false,rbEv);
  this.emit(rbEv);
  if(rr.off)return "oreb";
  return "dead";
};
GP.credAst=function(O,sh){
  const r=this.r;
  const a=pickW(r,O.on,x=>Math.exp((this.E(x,"pass")-60)/20)*(isHandler(x)?1.3:1),sh);
  if(a===sh)return null;
  a.ast++;return a.n;
};

/* ---------- 12. Rebotes ---------- */
GP.reboundDetail=function(O,D,ft,ev){
  const r=this.r,E=(x,k)=>this.E(x,k);
  if(!ft&&r()<.1){ev.rb="t";return {off:r()<.3}}
  const ro=O.on.reduce((a,x)=>a+Math.exp((E(x,"oreb")-58)/26)*(1+(E(x,"str")-62)*.004),0);
  const rd=D.on.reduce((a,x)=>a+Math.exp((E(x,"dreb")-58)/26)*(1+(E(x,"str")-62)*.004),0);
  let pOff=ro/(ro+(ft?5.6:2.95)*rd);
  pOff=clamp(pOff,.05,.5);
  const off=r()<pOff;
  const T=off?O:D,k=off?"oreb":"dreb";
  const who=pickW(r,T.on,x=>Math.exp((E(x,k)-58)/38)*(1+(E(x,"str")-62)*.004)*(1+(E(x,"speed")-65)*.002));
  if(off)who.orb++;else who.drb++;
  ev.rb=off?"o":"d";ev.c2=who.n;
  return {off,who};
};
GP.rebound=function(O,D,ft){
  const ev={k:"reb"};
  const res=this.reboundDetail(O,D,ft,ev);
  ev.s=res.off?O.side:D.side;ev.a=res.who?res.who.n:null;
  this.emit(ev);
  return res.off;
};

/* ---------- 13. Lesiones ---------- */
GP.injuryCheck=function(O,D,dur){
  const r=this.r;
  for(const T of [O,D])for(const x of T.on.slice()){
    // risque : âge, durabilité réelle, fatigue accumulée entre les matchs et fatigue dans le match
    const fat=x.f+(100-x.e)*.35;
    if(r()<5.1e-5*dur/14*(1+Math.max(0,x.p.a-28)*.02)*Math.exp((74-x.r.dur)/32)*(1+fat*.035)){
      const days=2+Math.floor(Math.pow(r(),2)*45);
      x.hurt=days;x.on=false;x.out=true;x.outT=this.t;
      T.on.splice(T.on.indexOf(x),1);
      this.inj.push({n:x.n,days,side:T.side});
      this.emit({k:"inj",s:T.side,a:x.n,v:days});
      const c=T.pl.filter(y=>!y.on&&!y.out&&!y.hurt).sort((a,b)=>this.val(T,b)-this.val(T,a))[0];
      if(c){c.on=true;c.inT=this.t;T.on.push(c);this.emit({k:"sub",s:T.side,a:c.n,b:x.n})}
      this.subWin=true;
    }
  }
};

/* ---------- 14. Resultado ---------- */
GP.result=function(){

};

/* ---------- statistiques par joueur ---------- */
// p.s / p.ps = [PJ, PTS, REB, AST, SEG(segundos), TC, TCI, 3P, 3PI, TL, TLI, ROB, TAP, PER, FAL, REBOF, +/-, 0]
const NS=18;
const newS=()=>new Array(NS).fill(0);
function padS(a){while(a.length<NS)a.push(0);return a}

/* ---------- simulation avec le moteur complet ---------- */
/* ---------- stratégies d'entraîneur ---------- */
// Attaque : S (autour de la star), C (collective), I (jeu intérieur). Défense : M (homme), Z (zone), D (double-équipe sur la star).
// "N" = équilibrée (aucune consigne), "A" = automatique (l'assistant ou l'ordinateur choisit selon l'effectif et les habitudes de l'adversaire).
const SO=["S","C","I"],SD=["M","Z","D"];
const SNAME={N:"Équilibrée",A:"Automatique",S:"Autour de la star",C:"Collective",I:"Jeu intérieur",M:"Homme à homme",Z:"Zone",D:"Double-équipe sur la star"};
function teamFits(tm,po){
  const L=lineup(S.teams[tm],po).map(x=>({r:ENG.ratingsOf(x.p),pos:x.p.p,tg:x.m}));
  return ENG.fitsOf(ENG.rawProfile(L));
}
// croyance sur ce que va jouer l'adversaire : ses 6 derniers choix, lissés avec un a priori uniforme
function stratBelief(opp){
  const q={o:{S:2,C:2,I:2},d:{M:2,Z:2,D:2}};
  if(opp!==undefined&&S.teams[opp])(S.teams[opp].hist||[]).slice(-6).forEach(h=>{if(q.o[h[0]]!==undefined)q.o[h[0]]++;if(q.d[h[1]]!==undefined)q.d[h[1]]++});
  return q;
}
function softPick(keys,vals,tau){
  const m=Math.max(...vals),w=vals.map(v=>Math.exp((v-m)/tau)),t=w.reduce((a,b)=>a+b,0);
  let u=Math.random()*t;for(let i=0;i<keys.length;i++){u-=w[i];if(u<=0)return keys[i]}
  return keys[keys.length-1];
}
// choix automatique : meilleure réponse à ce que l'adversaire a joué récemment, selon l'adéquation de son propre effectif, avec une part d'aléatoire
function pickStrat(tm,opp,po){
  const f=teamFits(tm,po),g=opp!==undefined?teamFits(opp,po):{S:1,C:1,I:1,M:1,Z:1,D:1},q=stratBelief(opp);
  const qo=SO.reduce((a,k)=>a+q.o[k],0),qd=SD.reduce((a,k)=>a+q.d[k],0);
  const eo=SO.map(o=>SD.reduce((a,d)=>a+q.d[d]/qd*ENG.stratPAdd(o,d,f[o],g[d],true),0));
  const ed=SD.map(d=>-SO.reduce((a,o)=>a+q.o[o]/qo*ENG.stratPAdd(o,d,g[o],f[d],true),0));
  return {off:softPick(SO,eo,.006),def:softPick(SD,ed,.006)};
}
function pushHist(tm,st){
  const t=S.teams[tm];if(!t||!st)return;
  t.hist=t.hist||[];t.hist.push(st[0]+st[1]);if(t.hist.length>8)t.hist.shift();
}
function simCfg(tm,po,opp){
  const T=S.teams[tm],L=lineup(T,po),have=new Set(L.map(x=>x.p));
  const out=L.map(x=>({p:x.p,tg:x.m}));

  const tc=T.tac||{};let off=tc.off||"A",def=tc.def||"A";
  if(off==="A"||def==="A"){const p=pickStrat(tm,opp,po);if(off==="A")off=p.off;if(def==="A")def=p.def}
  return {name:TEAMS[tm][1],L:out,tac:Object.assign({pace:0,three:0,press:0},tc,{off,def}),auto:true};
}
function addStats(tm,rows,po){

/* ---------- fatigue entre les matchs ---------- */
// p.f : fatigue accumulée (0 = frais, 70 = max). Elle monte avec les minutes jouées (l'endurance, elle, ne joue que PENDANT le match)
// et baisse chaque jour de repos selon le paramètre « récupération » (durabilité et âge, indépendant de l'endurance). Elle réduit légèrement les attributs et augmente le risque de blessure.
const FAT_MAX=70,FAT_GAIN=.95,FAT_REC=11,FAT_REC_INJ=22;
const fatPct=p=>Math.round(Math.min(FAT_MAX,p.f||0)/FAT_MAX*100);

function simGame(h,a,po){
  const ovk=S.pend?Object.keys(S.pend).find(k=>{const x=S.pend[k];return x.h===h&&x.a===a&&!!x.po===!!po}):undefined;
  let ov=ovk!==undefined?S.pend[ovk]:null;if(ov)delete S.pend[ovk];
  if(ov&&!(ov.full||(ov.hb&&ov.hb[0]&&ov.hb[0].length>5)))ov=null; // ancien résultat sans statistiques : on le simule à nouveau
  const res=ov||ENG.play({home:simCfg(h,po,a),away:simCfg(a,po,h),po:!!po,log:isHum(h)||isHum(a)});
  addStats(h,res.hb,po);addStats(a,res.ab,po);
  applyInj(res,h,a);
  applyFat(h,res.hb);applyFat(a,res.ab);
  if(res.st){pushHist(h,res.st[0]);pushHist(a,res.st[1])}
  let top=["",-1];
  [res.hb,res.ab].forEach(b=>b.forEach(r=>{if(r[1]>top[1])top=[r[0],r[1]]}));
  if(isHum(h)||isHum(a)){
    const det={k:Math.random().toString(36).slice(2,8),h,a,ph:res.ph,pa:res.pa,po:!!po,d:S.day,ot:res.ot||0,hb:res.hb,ab:res.ab,qs:res.qs||null,ev:res.ev||null,st:res.st||null};
    S.dets=S.dets||{};if(isHum(h))S.dets[h]=det;if(isHum(a))S.dets[a]=det;

}

/* ---------- postseason ---------- */
const pct=t=>(t.w+t.l)?t.w/(t.w+t.l):0;
function standings(conf){
  return Array.from({length:15},(_,k)=>conf*15+k).sort((a,b)=>{
    const A=S.teams[a],B=S.teams[b];
    return pct(B)-pct(A)||(B.pf-B.pa)-(A.pf-A.pa)||a-b;
  });
}
function rankOf(i){return standings(i<15?0:1).indexOf(i)+1}
function initPO(){
  computeAwards();
  S.po={st:"playin1",seeds:[standings(0),standings(1)],pin:[[],[]],rounds:[],champ:-1,pd:0,s7:[0,0],s8:[0,0],l7:[0,0],w9:[0,0]};
}
const ser=(c,x,sx,y,sy)=>({c,t:[x,y],sd:[sx,sy],w:[0,0],g:[],win:-1});
function poGame(h,a){const r=simGame(h,a,true);S.last.push([h,a,r.ph,r.pa]);return r}
function poDay(){
  const po=S.po;po.pd++;S.last=[];S.ld=poDate();
  if(po.st==="playin1"){
    for(let c=0;c<2;c++){
      const s=po.seeds[c],g1=[s[6],s[7]],g2=[s[8],s[9]],r1=poGame(g1[0],g1[1]),r2=poGame(g2[0],g2[1]);
      po.pin[c]=[{k:"7e contre 8e",t:g1,r:[r1.ph,r1.pa]},{k:"9e contre 10e",t:g2,r:[r2.ph,r2.pa]}];
      po.s7[c]=r1.ph>r1.pa?g1[0]:g1[1];po.l7[c]=r1.ph>r1.pa?g1[1]:g1[0];po.w9[c]=r2.ph>r2.pa?g2[0]:g2[1];
    }
    po.st="playin2";
  }else if(po.st==="playin2"){
    for(let c=0;c<2;c++){
      const g=[po.l7[c],po.w9[c]],r=poGame(g[0],g[1]);
      po.pin[c].push({k:"Dernière place (8e)",t:g,r:[r.ph,r.pa]});
      po.s8[c]=r.ph>r.pa?g[0]:g[1];
    }
    const rd=[];
    for(let c=0;c<2;c++){
      const s=po.seeds[c],T=[s[0],s[1],s[2],s[3],s[4],s[5],po.s7[c],po.s8[c]];
      [[0,7],[3,4],[2,5],[1,6]].forEach(([i,j])=>rd.push(ser(c,T[i],i+1,T[j],j+1)));
    }
    po.rounds.push(rd);po.st="r1";
  }else if(po.st!=="done"){
    const rd=po.rounds[po.rounds.length-1];
    for(const s of rd){
      if(s.win>=0)continue;
      const side=PAT[s.g.length],h=s.t[side],a=s.t[1-side],r=poGame(h,a);
      const sc=side===0?[r.ph,r.pa]:[r.pa,r.ph];
      s.g.push(sc);
      if(sc[0]>sc[1])s.w[0]++;else s.w[1]++;
      if(s.w[0]===4)s.win=0;else if(s.w[1]===4)s.win=1;
    }
    if(rd.every(s=>s.win>=0))advancePO();
  }

}
function advancePO(){
  const po=S.po,rd=po.rounds[po.rounds.length-1],n=rd.length;
  const Wn=s=>({t:s.t[s.win],sd:s.sd[s.win]});
  const mk=(c,A,B)=>A.sd<B.sd?ser(c,A.t,A.sd,B.t,B.sd):ser(c,B.t,B.sd,A.t,A.sd);
  if(n===8){const nr=[];for(let c=0;c<2;c++){const w=rd.slice(c*4,c*4+4).map(Wn);nr.push(mk(c,w[0],w[1]),mk(c,w[2],w[3]))}po.rounds.push(nr);po.st="r2"}
  else if(n===4){const nr=[];for(let c=0;c<2;c++){const w=rd.slice(c*2,c*2+2).map(Wn);nr.push(mk(c,w[0],w[1]))}po.rounds.push(nr);po.st="cf"}
  else if(n===2){
    const e=Wn(rd[0]),w=Wn(rd[1]),eBetter=pct(S.teams[e.t])>=pct(S.teams[w.t]);
    po.rounds.push([eBetter?ser(-1,e.t,e.sd,w.t,w.sd):ser(-1,w.t,w.sd,e.t,e.sd)]);po.st="finals";
  }else{
    const ch=rd[0].t[rd[0].win];po.champ=ch;po.st="done";
    const c=S.teams[ch].pl.filter(p=>p.ps&&p.ps[0]>0).sort((a,b)=>(b.ps[1]/b.ps[0]+b.o*.1)-(a.ps[1]/a.ps[0]+a.o*.1))[0];
    if(S.aw)S.aw.fmvp=c?[c.n,ch]:null;
  }
}
function simPO(mode){

  if(mode==="day")poDay();

function mySeries(){const po=S.po;if(!po)return null;let f=null,ri=-1;po.rounds.forEach((rd,r)=>rd.forEach(s=>{if(s.t.includes(S.me)){f=s;ri=r}}));return f?{s:f,r:ri}:null}

function ensureManual(){
  if(S.teams[S.me].man)return;
  const t=S.teams[S.me],mm=new Map(lineupAuto(t,false).map(x=>[x.p,x.m])),byOvr=t.pl.slice().sort((a,b)=>b.o-a.o);
  t.pl.forEach(p=>{p.m=mm.has(p)?mm.get(p):(p.i?(MIN[byOvr.indexOf(p)]||0):0)});
  t.man=true;
}
function setAuto(){S.teams[S.me].pl.forEach(p=>{delete p.m});S.teams[S.me].man=false;queueSave();render()}
function fit240(){
  ensureManual();
  const t=S.teams[S.me],av=t.pl.filter(p=>!p.i&&p.m>0),sum=av.reduce((s,p)=>s+p.m,0);
  if(!sum)return;
  av.forEach(p=>{p.m=Math.min(42,Math.round(p.m*240/sum))});
  let diff=240-av.reduce((s,p)=>s+p.m,0),guard=60;
  const ord=av.slice().sort((a,b)=>b.m-a.m);
  for(let k=0;diff!==0&&guard-->0;k++){const p=ord[k%ord.length],d=diff>0?1:-1;if(p.m+d>=1&&p.m+d<=42){p.m+=d;diff-=d}}
  queueSave();render();
}
function minsInfo(){
  const t=S.teams[S.me],L=lineup(t,false),tot=L.reduce((s,x)=>s+x.m,0);
  return {L,tot,cur:strengthL(L),auto:strengthL(lineupAuto(t,false))};
}

/* ---------- échanges ---------- */
function pval(p){
  let e=p.o;const f=p.a<=21?.42:p.a<=23?.34:p.a<=25?.22:p.a<=27?.08:0;
  e+=Math.min(8,Math.max(0,p.t-p.o)*f);if(p.a>30)e-=Math.pow(p.a-30,1.3)*.55;
  return Math.pow(1.22,e-60);
}
function tradeEval(){
  const me=S.teams[S.me],ot=S.teams[tt];
  const give=[...gs].map(i=>me.pl[i]).filter(Boolean),get=[...rs].map(i=>ot.pl[i]).filter(Boolean);
  const gpk=[...gp].map(i=>S.pk[i]).filter(Boolean),rpk=[...rp].map(i=>S.pk[i]).filter(Boolean);
  const rk=S.teams.map((t,i)=>[teamStr(t),i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const pv=k=>{const dy=k[0]-S.season;let e;if(k[1]===2)e=56;else if(dy<=0)e=62+.4*rk.indexOf(k[2]);else e=67.5-.6*dy;return Math.pow(1.22,e-60)};
  const topO=ot.pl.reduce((b,p)=>p.o>b.o?p:b,ot.pl[0]);
  const recv=give.reduce((s,p)=>s+mval(tt,p)*needM(tt,p,get),0)+gpk.reduce((s,k)=>s+mpick(tt,pv(k)),0);
  const ask=(get.reduce((s,p)=>s+mval(tt,p)*(p===topO?1.3:1),0)+rpk.reduce((s,k)=>s+mpick(tt,pv(k)),0))*1.1;
  const nm=cnt(me)-give.length+get.length,no=cnt(ot)-get.length+give.length;
  const okN=give.length+gpk.length>0&&get.length+rpk.length>0&&nm>=12&&nm<=15&&no>=12&&no<=15;
  const out=give.reduce((s,p)=>s+(p.c||0),0),inn=get.reduce((s,p)=>s+(p.c||0),0);
  const chk=(t,o,i,name)=>{const post=payroll(t)-o+i;return (post<=CAP||i<=o*1.25+.1)?null:`${name} se retrouverait à ${post.toFixed(1)} M, au-dessus du plafond de ${CAP} M, et ne peut recevoir que 125 % de ce qu'elle envoie (${(o*1.25+.1).toFixed(1)} M).`};
  const sal=chk(me,out,inn,"Ton équipe")||chk(ot,inn,out,TEAMS[tt][0]);
  return {give,get,gpk,rpk,r:ask>0?recv/ask:0,okN,nm,no,sal,out,inn,recv,ask,topO};
}
function tradeNames(){
  const me=S.teams[S.me],ot=S.teams[tt];
  return {to:tt,give:[...gs].map(i=>me.pl[i]&&me.pl[i].n).filter(Boolean),get:[...rs].map(i=>ot.pl[i]&&ot.pl[i].n).filter(Boolean),
    gpk:[...gp].map(i=>S.pk[i]).filter(Boolean).map(k=>k.slice(0,3)),rpk:[...rp].map(i=>S.pk[i]).filter(Boolean).map(k=>k.slice(0,3))};
}
function loadSel(x,from,to){
  tt=to;gs.clear();rs.clear();gp.clear();rp.clear();
  S.teams[from].pl.forEach((p,i)=>{if(x.give.includes(p.n))gs.add(i)});
  S.teams[to].pl.forEach((p,i)=>{if(x.get.includes(p.n))rs.add(i)});
  const has=(L,k)=>L.some(g=>g[0]===k[0]&&g[1]===k[1]&&g[2]===k[2]);
  S.pk.forEach((k,i)=>{if(k[3]===from&&has(x.gpk,k))gp.add(i);if(k[3]===to&&has(x.rpk,k))rp.add(i)});
}
function clearSel(){gs.clear();rs.clear();gp.clear();rp.clear()}
function doTrade(){
  const ev=tradeEval(),hu=isHum(tt);
  if(!(ev.okN&&!ev.sal&&(hu||ev.r>=1)&&tradeOpen()))return;
  if(hu){
    S.props=S.props||[];
    S.props.push({id:Math.random().toString(36).slice(2,8),from:S.me,to:tt,give:ev.give.map(p=>p.n),get:ev.get.map(p=>p.n),gpk:ev.gpk.map(k=>k.slice(0,3)),rpk:ev.rpk.map(k=>k.slice(0,3)),d:S.day});
    tmsg=`Proposition envoyée à ${TEAMS[tt][0]}. Son manager devra l'accepter.`;clearSel();queueSave();render();return;
  }
  applyTrade(ev);
}
function propAct(id,acc){
  const k=(S.props||[]).findIndex(p=>p.id===id);if(k<0){tmsg="Cette proposition n'existe plus.";return}
  const pr=S.props[k];
  if(pr.to!==S.me&&pr.from!==S.me)return;
  S.props.splice(k,1);
  if(!acc||pr.from===S.me){tmsg=pr.from===S.me?"Proposition retirée.":"Proposition refusée.";return}
  const m0=S.me,t0=tt;S.me=pr.from;loadSel(pr,pr.from,pr.to);
  const ev=tradeEval(),n1=ev.give.length+ev.gpk.length,n2=ev.get.length+ev.rpk.length;
  if(ev.okN&&!ev.sal&&n1===pr.give.length+pr.gpk.length&&n2===pr.get.length+pr.rpk.length&&tradeOpen()){applyTrade(ev);S.me=m0;tt=t0;clearSel();tmsg="Échange conclu.";return}
  S.me=m0;tt=t0;clearSel();tmsg="La proposition n'est plus valide (un joueur, l'effectif ou les salaires ont changé).";
}
function applyTrade(ev){
  const me=S.teams[S.me],ot=S.teams[tt];
  const pool=me.man?ev.give.map(p=>p.m||0).sort((a,b)=>b-a):[];
  me.pl=me.pl.filter(p=>!ev.give.includes(p)).concat(ev.get);
  ot.pl=ot.pl.filter(p=>!ev.get.includes(p)).concat(ev.give);
  ev.give.forEach(p=>{delete p.m});
  if(me.man)ev.get.slice().sort((a,b)=>b.o-a.o).forEach((p,k)=>{p.m=pool[k]||0});
  ev.gpk.forEach(k=>{k[3]=tt});ev.rpk.forEach(k=>{k[3]=S.me});
  S.trades.unshift([S.day,tt,ev.give.map(p=>p.n).concat(ev.gpk.map(pickLabel)),ev.get.map(p=>p.n).concat(ev.rpk.map(pickLabel)),S.me]);
  if(isHum(tt))S.trades.unshift([S.day,S.me,ev.get.map(p=>p.n).concat(ev.rpk.map(pickLabel)),ev.give.map(p=>p.n).concat(ev.gpk.map(pickLabel)),tt]);
  S.trades.length=Math.min(S.trades.length,30);
  tmsg=`Échange conclu avec ${TEAMS[tt][0]}.`;
  clearSel();queueSave();render();
}

    <p class="note" style="max-width:78ch">Chaque stratégie en bat une et perd contre une autre : la double-équipe contre le jeu autour de la star, la zone contre le jeu intérieur, l'homme à homme contre le jeu collectif. En retour, le jeu autour de la star prend l'avantage sur la zone, le jeu collectif sur la double-équipe et le jeu intérieur sur l'homme à homme. L'adéquation indique à quel point ton effectif convient à chaque choix : elle compte autant que le face-à-face. Même bien choisie, une stratégie ne remplace pas la qualité de l'effectif. « Automatique » choisit pour toi selon ton effectif et les habitudes récentes de l'adversaire.</p>
    ${hist.length?`<div class="muted" style="margin-top:6px">Tes derniers matchs (l'adversaire peut les lire) :</div><div>${hist.map(chip).join("")}</div>`:""}</div>`;

function teamStyle(tm){
  let fga=0,fgm=0,tpa=0,ast=0,fta=0,tov=0;
  S.teams[tm].pl.forEach(p=>{const s=p.s||[];fgm+=s[5]||0;fga+=s[6]||0;tpa+=s[8]||0;ast+=s[3]||0;fta+=s[10]||0;tov+=s[13]||0});
  return fga>150?{tpr:tpa/fga,apf:ast/Math.max(1,fgm),ftr:fta/fga,tov:tov/(fga+.44*fta+tov)}:null;
}

function scoutHints(opp){

const CAP=165,MINC=1.5;
const salOf=o=>Math.round((1.5+55*Math.pow(Math.max(0,o-56)/34,1.7))*10)/10;
const faAsk=p=>Math.max(MINC,Math.round(salOf(p.o)*(p.a>=33?.75:p.a<=24?1.05:1)*10)/10);
const renewAsk=p=>Math.round(salOf(p.o)*(p.a>=33?.8:1.05)*10)/10;
const yearsFor=p=>p.a<=26?3:p.a<=30?2:1;
const payroll=t=>t.pl.reduce((s,p)=>s+(p.y>0?(p.c||0):0),0);
const cnt=t=>t.pl.filter(p=>p.y>0).length;
const rookieC=k=>k<30?Math.round((11.5-k*.3)*10)/10:1.5;
const tval=p=>pval(p)*clamp(1+(p.c!=null?(salOf(p.o)-p.c)*.012:0),.7,1.35);
const pickLabel=k=>(k[1]===1?"1er":"2e")+" tour "+(2027+k[0])+" ("+TEAMS[k[2]][1]+")";
const mkPicks=y0=>{const a=[];for(let y=y0;y<y0+3;y++)for(let r=1;r<=2;r++)for(let t=0;t<30;t++)a.push([y,r,t,t]);return a};
function refreshPicks(){
  S.pk=S.pk.filter(k=>k[0]>=S.season);
  const y=S.season+2;
  if(!S.pk.some(k=>k[0]===y))for(let r=1;r<=2;r++)for(let t=0;t<30;t++)S.pk.push([y,r,t,t]);
}
function newC(p){p.c=Math.round(salOf(p.o)*(.8+Math.random()*.4)*10)/10;p.y=1+Math.floor(Math.random()*(p.o>=80?5:4));return p}
function mkp(d){const p=newC({n:d.name,p:d.pos,a:d.age,o:d.ovr,t:d.pot,i:0,s:newS()});p.q0=d.ovr;const k=CT[d.name];if(k){p.c=k[0][0];p.y=k[0].length;p.cs=k[0].slice(1);if(k[1])p.op=k[1]}if(d.age<=19)p.rk=-1;return p}
function aiFA(){
  for(let round=0;round<4;round++){
    const order=S.teams.map((x,i)=>i).filter(i=>!isHum(i)).sort(()=>Math.random()-.5);
    for(const i of order){
      const t=S.teams[i];if(cnt(t)>=15||!S.fa.length)continue;
      const pay=payroll(t),worst=Math.min(...t.pl.map(p=>p.o));
      let b=-1;
      S.fa.forEach((p,k)=>{const a=faAsk(p);if(p.o<=worst||(pay+a>CAP&&a>2))return;if(b<0||mval(i,p)>mval(i,S.fa[b]))b=k});
      if(b>=0){const p=S.fa.splice(b,1)[0];p.c=faAsk(p);p.y=yearsFor(p);t.pl.push(p)}
    }
  }
}
function rollContracts(){
  S.teams.forEach((t,ti)=>{
    t.pl.forEach(p=>{p.y--;if(p.y>0&&p.cs&&p.cs.length)p.c=p.cs.shift()});
    if(isHum(ti))return;
    const keep=[];
    t.pl.forEach(p=>{
      if(p.y>0){keep.push(p);return}
      if(Math.random()<Math.min(.9,.3+(p.o-58)/50+reMode(ti,p))){p.y=yearsFor(p)+(Math.random()<.4?1:0);p.c=Math.round(salOf(p.o)*(.9+Math.random()*.3)*10)/10;keep.push(p)}
      else S.fa.push(p);
    });
    t.pl=keep;
  });
  capFA();
}

  const p=S.teams[S.me].pl[i];if(!p||p.y>0)return;
  p.c=renewAsk(p);p.y=yearsFor(p);queueSave();render();
}

/* ---------- récompenses ---------- */
function computeAwards(){
  const L=[];
  S.teams.forEach((t,ti)=>t.pl.forEach(p=>{if(p.s[0]<40)return;L.push({p,ti,sc:ppgOf(p)+p.o*.35+pct(t)*22})}));
  L.sort((a,b)=>b.sc-a.sc);
  const nm=x=>x?[x.p.n,x.ti]:null,posf={C:1.06,PF:1.03,SF:1,SG:.97,PG:.95};
  const best=(arr,f)=>arr.reduce((b,x)=>{const v=f(x);return (!b||v>b.v)?{x,v}:b},null);
  const pick=(arr,f)=>{const r=best(arr,f);return r?r.x:null};
  const aw={mvp:nm(L[0]),anba:L.slice(0,10).map(x=>[x.p.n,x.ti])};
  aw.dpoy=nm(pick(L,x=>x.p.o*(posf[x.p.p]||1)+pct(S.teams[x.ti])*8+gauss()*1.5));
  aw.roy=nm(pick(L.filter(x=>x.p.rk),x=>x.p.o*.4+ppgOf(x.p)));
  aw.smoy=nm(pick(L.filter(x=>{const k=S.teams[x.ti].pl.slice().sort((a,b)=>b.o-a.o).indexOf(x.p);return k>=5&&k<=9}),x=>ppgOf(x.p)+gauss()*.8));
  aw.mip=nm(pick(L.filter(x=>x.p.dl>=2&&x.p.a<=27&&!x.p.rk),x=>x.p.dl+gauss()*.5));
  aw.fmvp=null;
  S.aw=aw;S.mvp=aw.mvp;
}
function awNames(){
  const a=S.aw||{},o={};
  ["mvp","dpoy","roy","smoy","mip","fmvp"].forEach(k=>{o[k]=a[k]?a[k][0]:""});
  return o;
}

function baseSc(p,k){
  if(k==="t")return p.o*.6+p.t*.1+({SG:8,PG:6,SF:4}[p.p]||0);
  return (p.o+p.t)/2+({SF:4,SG:3,PF:2,PG:-1}[p.p]||0)-(p.a-22)*.6;

function asPick(c){

}
function asSim(){
  const E=asPick(0),Wt=asPick(1),avg=a=>a.reduce((s,x)=>s+x.p.o,0)/a.length;
  const tot=clamp(Math.round(340+gauss()*14),300,380),m=(avg(E)-avg(Wt))*1.6+gauss()*8;
  let e=Math.round((tot+m)/2),w=tot-e;if(e===w)e++;
  const mk=(L,pts)=>{const P=allocate(pts,L.map(x=>Math.pow(Math.max(x.p.o-40,1),2)));return L.map((x,k)=>({n:x.p.n,t:x.t,pt:P[k]}))};
  const re=mk(E,e),rw=mk(Wt,w),win=(e>w?re:rw).slice().sort((a,b)=>b.pt-a.pt)[0];
  S.as.g={e,w,E:re,W:rw,mvp:[win.n,win.t,win.pt]};

function contestSim(k){
  const E=S.as.E||{},all=[];
  S.teams.forEach((t,ti)=>t.pl.forEach(p=>{
    if(p.i)return;
    const mine=(E[ti]||{})[k]===p.n;
    if(elig(p,k)||mine){const b=baseSc(p,k);all.push({p,t:ti,b,z:b+gauss()*4,mine})}
  }));
  const ent=all.filter(x=>x.mine),rest=all.filter(x=>!x.mine).sort((a,b)=>b.z-a.z).slice(0,8-ent.length);
  const f=k==="t"?b=>clamp(Math.round(13+(b-62)*.38+gauss()*2.8),6,30):b=>clamp(Math.round(78+(b-70)*.45+gauss()*3.5),66,100);
  const rows=ent.concat(rest).map(x=>({n:x.p.n,t:x.t,b:x.b,r1:f(x.b),f:null,w:0}));
  const fin=rows.slice().sort((a,b)=>b.r1-a.r1).slice(0,3);
  fin.forEach(r=>{r.f=f(r.b)});
  const win=fin.slice().sort((a,b)=>b.f-a.f||b.r1-a.r1)[0];win.w=1;
  rows.sort((a,b)=>((b.f!==null)-(a.f!==null))||((b.f||0)-(a.f||0))||(b.r1-a.r1));
  rows.forEach(r=>{delete r.b});
  S.as[k]={rows,win:win.n,wt:win.t};
}

/* ---------- MVP, progression et effectifs ---------- */
function seasonMvp(){
  let best=null;
  S.teams.forEach((t,ti)=>t.pl.forEach(p=>{if(p.s[0]<40)return;const sc=ppgOf(p)+p.o*.35+pct(t)*22;if(!best||sc>best.sc)best={sc,n:p.n,t:ti}}));
  S.mvp=best?[best.n,best.t]:null;
}
function progress(p){
  p.a++;const a=p.a,o0=p.o;
  const base=a<=20?2.2:a<=21?1.8:a<=22?1.4:a<=23?1.0:a<=24?.6:a<=25?.2:a<=27?-.3:a<=28?-.6:a<=29?-1.1:a<=30?-1.7:a<=31?-2.3:a<=33?-3:-3.9;
  const d=a<=25?base+(p.t-p.o)*.1+gauss()*1.8:base+gauss()*1.5;
  p.o=clamp(Math.round(p.o+d),45,99);
  p.t=a<=26?clamp(Math.max(p.o,Math.round(p.t+gauss()*1.5-.8)),45,99):p.o;
  p.i=0;p.f=0;delete p.m;if(p.rk!==undefined&&p.rk<=S.season)delete p.rk;delete p.ps;p.s=newS();p.dl=p.o-o0;
  return p.o-o0;
}
const retire=p=>(p.a>=37&&p.o<72)||p.a>=39;
function trimTeam(i){const t=S.teams[i];while(t.pl.length>15){let w=0;t.pl.forEach((p,k)=>{if(pval(p)<pval(t.pl[w]))w=k});S.fa.push(t.pl.splice(w,1)[0])}}
function capFA(){S.fa.sort((a,b)=>pval(b)-pval(a));S.fa.length=Math.min(S.fa.length,60)}
function filler(){
  const o=50+Math.floor(Math.random()*8);
  return {n:rndName(leagueNames()),p:POS5[Math.floor(Math.random()*5)],a:22+Math.floor(Math.random()*5),o,t:o+2,i:0,s:newS()};
}
function signBest(t,cheap){
  let b=-1;S.fa.forEach((p,k)=>{if(cheap&&faAsk(p)>2)return;if(b<0||pval(p)>pval(S.fa[b]))b=k});
  const p=b>=0?S.fa.splice(b,1)[0]:filler();
  p.c=faAsk(p);p.y=yearsFor(p);t.pl.push(p);
}
function cutPlayer(i){
  const t=S.teams[S.me];if(t.pl.length<=12||!t.pl[i])return;
  const p=t.pl.splice(i,1)[0];delete p.m;delete p.rk;S.fa.push(p);capFA();queueSave();render();

function signFA(i){
  const t=S.teams[S.me],p=S.fa[i];if(!p)return;
  if(cnt(t)>=15){tmsg="Effectif complet (15 joueurs) : libère une place avant de signer quelqu'un.";render();return}
  const ask=faAsk(p);if(payroll(t)+ask>CAP&&ask>2){tmsg=`Pas assez de marge sous le plafond pour ${p.n} (${ask.toFixed(1)} M).`;render();return}

}

/* ---------- draft ---------- */
function genClass(){
  const used=leagueNames(),out=[];
  for(let r=0;r<72;r++){
    const pt=clamp(Math.round(86-r*.5+gauss()*3),50,90),o=clamp(Math.round(49+(pt-58)*.7+gauss()*2.5),45,74);
    out.push({n:rndName(used),p:POS5[Math.floor(Math.random()*5)],a:pt>=78?(Math.random()<.65?19:20):19+Math.floor(Math.random()*4),o:Math.min(o,pt),t:pt});
  }
  return out.sort((x,y)=>(y.t*.6+y.o*.4)-(x.t*.6+x.o*.4));
}
function startDraft(){
  if(S.dr||!S.po||S.po.st!=="done")return;
  const po=S.po,inPO=new Set(po.rounds[0].flatMap(s=>s.t)),won=new Map();
  po.rounds.forEach(rd=>rd.forEach(s=>{if(s.win>=0){const w=s.t[s.win];won.set(w,(won.get(w)||0)+1)}}));
  const rec=i=>pct(S.teams[i]),dif=i=>S.teams[i].pf-S.teams[i].pa;
  const lot=Array.from({length:30},(_,i)=>i).filter(i=>!inPO.has(i)).sort((a,b)=>rec(a)-rec(b)||dif(a)-dif(b));
  const pl=Array.from(inPO).sort((a,b)=>(won.get(a)||0)-(won.get(b)||0)||rec(a)-rec(b));
  const base=lot.concat(pl),wts=[140,140,140,125,105,90,75,60,45,30,20,15,10,5],pool=lot.map((t,i)=>({t,w:wts[i]||5})),top=[];
  for(let k=0;k<4&&pool.length;k++){
    const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,j=0;
    while(j<pool.length-1&&r>=pool[j].w){r-=pool[j].w;j++}
    top.push(pool[j].t);pool.splice(j,1);
  }
  const r1=top.concat(base.filter(t=>!top.includes(t)));
  const orig=r1.concat(base),hold=(t,r)=>{const k=S.pk.find(x=>x[0]===S.season&&x[1]===r&&x[2]===t);return k?k[3]:t};
  S.dr={pool:genClass(),orig,order:orig.map((t,k)=>hold(t,k<30?1:2)),pk:0,picks:[],tk:[],top,done:false};
  rollContracts();
}
function draftTake(idx){
  const d=S.dr,team=d.order[d.pk],p=d.pool[idx];
  S.teams[team].pl.push({n:p.n,p:p.p,a:p.a,o:p.o,t:p.t,i:0,s:newS(),rk:S.season+1,c:rookieC(d.pk),y:d.pk<30?3:2});
  d.picks.push({k:d.pk,t:team,n:p.n,p:p.p,o:p.o,pt:p.t,og:d.orig?d.orig[d.pk]:team});d.tk.push(idx);d.pk++;
  if(d.pk>=d.order.length)finishDraft();
}
function bestAvail(noise){
  const d=S.dr,tk=new Set(d.tk);let best=-1,bs=-1e9;
  d.pool.forEach((p,i)=>{if(tk.has(i))return;const s=p.t*.6+p.o*.4+(noise?gauss()*2.5:0);if(s>bs){bs=s;best=i}});
  return best;
}
function finishDraft(){
  const d=S.dr,tk=new Set(d.tk);
  d.pool.forEach((p,i)=>{if(!tk.has(i))S.fa.push({n:p.n,p:p.p,a:p.a,o:p.o,t:p.t,i:0,s:newS()})});
  S.teams.forEach((t,i)=>{if(!isHum(i))trimTeam(i)});
  capFA();d.done=true;
}
function draftSim(mode){
  const d=S.dr;if(!d||d.done)return;
  if(mode==="best"&&d.order[d.pk]===S.me)draftTake(bestAvail(false));
  else if(mode==="one"&&!isHum(d.order[d.pk]))draftTake(bestAvail(true));
  else if(mode==="me"){while(!d.done&&!isHum(d.order[d.pk]))draftTake(bestAvail(true))}
  else if(mode==="all"){while(!d.done)draftTake(bestAvail(!isHum(d.order[d.pk])))}
  queueSave();render();
}

async function commit(fn,quiet){
  if(!LG){INTX=true;try{fn()}finally{INTX=false}queueSave();return}
  if(cbusy){if(quiet){setTimeout(()=>commit(fn,quiet),400)}else{tmsg="La ligue traite une autre action ; réessaie.";render()}return}
  cbusy=true;
  try{
    let got=false;
    for(let k=0;k<14&&!got;k++){
      const r=await LKD.acquire({holder:HOLD,ttlMs:1500});got=!!r.acquired;
      if(!got)await sleep(300+Math.random()*300);
    }
    if(!got){tmsg="La ligue est occupée ; réessaie.";return}
    const snap=await LGD.get();
    if(snap.exists)adopt(snap.data());
    INTX=true;try{fn()}finally{INTX=false}
    let js=JSON.stringify(S);if(js.length>200000){delete S.dets;js=JSON.stringify(S)}
    await LGD.set({v:1,rev:LGREV+1,state:js,at:Date.now()});
    LGREV++;saveState="ok";
  }catch(e){saveState=(e&&e.code==="invalid_argument")?"ro":"err";tmsg="Impossible d'enregistrer le changement dans la ligue."}
  finally{cbusy=false}
  if(!quiet)render();else paintSave();
}

function go(kind,m,force){
  const run=mm=>kind==="rs"?simulate(mm):simPO(mm);

  if(S.hum.length<2||force){const mm=m||"day";run(mm);S.rdy={};S.pend={};return}
  Object.keys(S.rdy).forEach(h=>{if(!S.rdy[h].startsWith(kind+":"))delete S.rdy[h]});
  if(m)S.rdy[S.me]=kind+":"+m;
  if(S.hum.every(h=>S.rdy[h]||(S.pend&&S.pend[h]))){
    const ms=S.hum.filter(h=>S.rdy[h]).map(h=>Math.max(0,ord.indexOf(S.rdy[h].split(":")[1])));
    const mm=ord[ms.length?Math.min(...ms):0];
    run(mm);S.rdy={};S.pend={};
  }else{tmsg="Marqué comme prêt. La ligue avancera quand tout le monde le sera.";queueSave();render()}
}

/* ---------- match en direct ---------- */
function rngOf(str){let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- match : texte du play-by-play et feuilles de stats ---------- */
let LVF="all"; // "all" = todas las jugadas, "key" = solo las importantes
const sn=n=>{if(!n)return "";const a=n.split(" ");return a.length>1?a[0][0]+". "+a.slice(1).join(" "):n};
const VR=(arr,e)=>arr[((e.t||0)*7+((e.a||"").length))%arr.length];
function fmtQ(q,c){const r=Math.max(0,Math.round(c));return (q<=4?"Q"+q:"PR"+(q-4))+" "+String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")}
function clockGT(gt){
  if(gt<2880){const q=Math.floor(gt/720)+1;return fmtQ(q,720-gt%720)}
  const o=Math.floor((gt-2880)/300)+1;return fmtQ(4+o,300-(gt-2880)%300);
}
function evTxt(e){
  const A=sn(e.a),B=sn(e.b);
  switch(e.k){
    case "fg":{

        const r=rnd();let v=left>=3&&r<.24?3:(left>=2&&r<.86?2:1);let as=null;
        if(v>=2&&rnd()<.55){let tot=0;wa.forEach((w,k)=>{if(k!==bi)tot+=w});let x=rnd()*tot;for(let k=0;k<box.length;k++){if(k===bi)continue;x-=wa[k];if(x<=0){as=box[k][0];break}}}
        ev.push({t:Math.floor(rnd()*2879)+1,s:sd,a:b[0],b:as,v,k:v===1?"ft":"fg",x:v===3?"three":"rim",y:v===3?"three":"lay"});left-=v;
      }
    });
  };
  side(det.hb,0);side(det.ab,1);
  ev.sort((x,y)=>x.t-y.t);
  [720,1440,2160,2880].forEach((q,k)=>ev.push({t:q,k:"q",q:k+1,v:k+1}));
  ev.sort((x,y)=>x.t-y.t||(x.k==="q"?1:0)-(y.k==="q"?1:0));
  let sh=0,sa=0;
  ev.forEach(e=>{if(e.k==="fg"||e.k==="ft"){if(e.s===0)sh+=e.v;else sa+=e.v;if(e.k==="ft")e.v=1,e.n=1,e.m=1}

}

  if(!GM)return;
  const G=GM,e=G.eng,T=e.tm[G.mi];
  const lv=ev.target.closest("[data-lv]");
  if(lv){
    const a=lv.dataset.lv;
    if(a==="pause"){G.paused=!G.paused;G.selPause=false}
    else if(a==="auto"){T.auto=!T.auto;if(T.auto)e.doSubs(T);gmFlush()}
    else if(a==="to"){if(e.callTimeout(G.mi)){gmFlush()}}
    else if(a==="flt"){LVF=LVF==="all"?"key":"all";G.feed=[];for(let i=0;i<G.evi;i++)pushFeed(G,e.ev[i],G.h,G.a)}
    else if(a==="tac"){
      const k=lv.dataset.k,tm=S.teams[S.me];tm.tac=tm.tac||{pace:0,three:0,press:0};
      tm.tac[k]=((tm.tac[k]+2)%3)-1;T.tac=Object.assign({},tm.tac);queueSave();
    }
    else if(a==="skip"){T.auto=true;e.runToEnd();gmFlush();G.done=true;gmFinish();return}
    else G.sp=+a;
    gmBuild();return;
  }
  const r=ev.target.closest("[data-gm]");if(!r)return;
  const i=+r.dataset.gm,x=T.pl[i];if(!x||x.out||x.hurt)return;
  if(G.sel===null){G.sel=i;if(!G.paused){G.paused=true;G.selPause=true}}
  else if(G.sel===i){G.sel=null;if(G.selPause){G.paused=false;G.selPause=false}}
  else{
    const y=T.pl[G.sel];
    if(y.on!==x.on){
      const o=y.on?y:x,n=y.on?x:y;
      if(e.swap(G.mi,o.idx,n.idx)){T.auto=false;gmFlush()}
      G.sel=null;if(G.selPause){G.paused=false;G.selPause=false}
    }else G.sel=i;
  }
  gmBuild();
}
function gmFinish(){
  const G=GM;if(!G||G.fin===2)return;G.fin=2;
  const res=Object.assign(G.eng.result(),{full:true,h:G.h,a:G.a,po:G.po});
  const kind=G.kind;
  const sum=`${TEAMS[G.h][1]} ${res.ph}–${res.pa} ${TEAMS[G.a][1]}${res.ot?` (${res.ot} prolongation${res.ot>1?"s":""})`:""}`;
  GM=null;
  setTimeout(async()=>{
    await commit(()=>{S.pend=S.pend||{};S.pend[S.me]=res;go(kind,null)});
    const el=document.getElementById("live");
    if(el){
      const det=S.dets&&S.dets[S.me];
      const ok=det&&det.ph===res.ph&&det.pa===res.pa&&det.ev;
      const d=ok?det:Object.assign({},res,{k:"x",d:S.day});
      const wait=S.pend&&S.pend[S.me];
      el.innerHTML=`<div class="lv-box wide"><div class="lv-top">${tb(res.h,"lg")}<b class="num lv-sc">${res.ph}</b><span class="muted">–</span><b class="num lv-sc">${res.pa}</b>${tb(res.a,"lg")}</div><div class="lv-mid"><b>FINAL</b></div><p class="muted" style="text-align:center">${esc(sum)}${wait?" · Résultat enregistré ; en attente des autres managers pour clore la journée.":""}</p><div class="lv-final">${fullBox(d)}</div><div class="btns lv-ctl"><button class="btn pri" data-lv="close">Fermer</button></div></div>`;
      el.onclick=e=>{if(e.target.closest('[data-lv="close"]'))closeLive()};
    }
  },50);
}

/* ---------- sauvegarde ---------- */
function queueSave(){if(LG){if(!INTX)syncMine();return}dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
async function flush(){
  if(LG||saving||!dirty||!S)return;
  saving=true;dirty=false;
  const payload=JSON.stringify(S);
  try{localStorage.setItem(LS,payload)}catch(e){}
  if(dbDoc){
    try{await dbDoc.set({v:2,state:payload,at:Date.now()});saveState="ok"}
    catch(e){saveState=(e&&e.code==="invalid_argument")?"ro":"err"}
  }else saveState="local";
  saving=false;paintSave();
  if(dirty)flush();
}
function paintSave(){
  const el=document.getElementById("savest");if(!el)return;
  const m={ok:["ok",LG?"Ligue synchronisée":"Sauvegardée sur ton compte"],local:["","Sauvegardée uniquement dans ce navigateur"],err:["err","Sauvegarde dans le cloud impossible ; la partie reste dans ce navigateur"],
    ro:["err","Ton accès est en lecture seule : demande un accès collaborateur au propriétaire"],"":["","Pas encore sauvegardée"]}[saveState]||["",""];

function migrate(){
  if(!S.hum)S.hum=[S.me];
  if(!S.rdy)S.rdy={};
  if(!S.props)S.props=[];
  if(!S.dets)S.dets={};
  if(!S.pend)S.pend={};
  if(S.manual){if(S.teams[S.me])S.teams[S.me].man=true}
  delete S.manual;
  if(S.as&&!S.as.E){S.as.E={};if(S.as.et||S.as.ed)S.as.E[S.me]={t:S.as.et||"",d:S.as.ed||""}}
  if(!S.v||S.v<2){S.v=2;S.po=null;S.trades=[]}
  if(S.season===undefined){S.season=0;S.fa=[];S.hist=[];S.dr=null;S.as=ASDEF();S.mvp=null}
  if(S.pk===undefined){S.pk=mkPicks(S.season);S.aw=null}
  S.teams.forEach(t=>t.pl.forEach(p=>{if(p.c===undefined)newC(p);if(p.s)padS(p.s);if(p.ps)padS(p.ps)}));
  (S.fa||[]).forEach(p=>{if(p.s)padS(p.s);if(p.ps)padS(p.ps)});
  if(S.ld===undefined)S.ld=S.last&&S.last.length?Math.max(0,S.day-1):0;
}

/* ---------- marché : modes des équipes, échanges entre équipes, conseiller de trades ---------- */
// Mode d'une équipe selon son classement de force : « titre » (8 premières), « reconstruction » (10 dernières), sinon neutre.
let MODEC={k:"",a:[]};
function teamMode(i){
  const k=S.season+"|"+S.day+"|"+(S.po?S.po.st:"");
  if(MODEC.k!==k){MODEC={k,a:S.teams.map((t,j)=>[teamStr(t),j]).sort((x,y)=>y[0]-x[0]).map(x=>x[1])}}
  const r=MODEC.a.indexOf(i);return r<8?"titre":r>=20?"recon":"neutre";
}
const MODE_NAME={titre:"vise le titre",recon:"reconstruit",neutre:"est dans le ventre mou"};
// valeur d'un joueur pour l'équipe i : les candidats au titre préfèrent l'expérience, les équipes en reconstruction la jeunesse
function mval(i,p){
  const m=teamMode(i),a=p.a;let k=1;
  if(m==="titre")k=a>=29?1.15:a<=23?.9:1;
  else if(m==="recon")k=a<=24?1.15:a>=30?.82:1;
  return tval(p)*k;
}
const mpick=(i,v)=>v*(teamMode(i)==="titre"?.85:teamMode(i)==="recon"?1.2:1);
const posGrp=p=>p.p==="PG"||p.p==="SG"?0:p.p==="C"?2:1;
// besoin de poste : une équipe déjà bien fournie à un poste paye un peu moins, une équipe en manque un peu plus
function needM(i,p,out){
  const t=S.teams[i],top=t.pl.filter(x=>x.y>0&&!out.includes(x)).sort((a,b)=>b.o-a.o).slice(0,9);
  const c=top.filter(x=>posGrp(x)===posGrp(p)).length;
  return 1+clamp((3-c)*.05,-.1,.1);
}
function saleOK(t,o,i){const post=payroll(t)-o+i;return post<=CAP||i<=o*1.25+.1}
/* échanges entre équipes de l'ordinateur : un candidat au titre prend un vétéran à une équipe en reconstruction contre des jeunes */
function aiTrade(){for(let k=0;k<20;k++)if(aiTrade1())return}
function aiTrade1(){
  if(!S||!S.teams)return false;
  const ai=S.teams.map((t,i)=>i).filter(i=>!isHum(i));
  const cont=ai.filter(i=>teamMode(i)==="titre"),rec=ai.filter(i=>teamMode(i)==="recon");
  if(!cont.length||!rec.length)return false;
  const A=cont[Math.floor(Math.random()*cont.length)],B=rec[Math.floor(Math.random()*rec.length)];
  const ta=S.teams[A],tb=S.teams[B];
  const tgt=tb.pl.filter(p=>p.y>0&&p.a>=28&&p.o>=68).sort((x,y)=>y.o-x.o)[0];
  if(!tgt)return false;
  const rank=ta.pl.slice().sort((x,y)=>y.o-x.o);
  const pool=ta.pl.filter(p=>p.y>0&&p.a<=27&&rank.indexOf(p)>=4&&p.o<tgt.o-3).sort((x,y)=>mval(B,y)-mval(B,x)).slice(0,6);
  const pv=k=>{const dy=k[0]-S.season;const e=k[1]===2?56:dy<=0?62+.4*15:67.5-.6*dy;return Math.pow(1.22,e-60)};
  const picks=S.pk.filter(k=>k[3]===A&&k[1]===1&&(k[0]>S.season||(k[0]===S.season&&!S.dr))).sort((x,y)=>x[0]-y[0]);
  const pls=[[]];pool.forEach((p,i)=>{pls.push([p]);for(let j=i+1;j<pool.length;j++)pls.push([p,pool[j]])});
  const opts=[];
  pls.forEach(c=>{for(let n=0;n<=Math.min(2,picks.length);n++){if(!c.length&&!n)continue;const pk=picks.slice(0,n);opts.push({c,pk,cost:c.reduce((s,p)=>s+tval(p),0)+pk.reduce((s,k)=>s+pv(k),0)})}});
  opts.sort((x,y)=>x.cost-y.cost);
  const ask=mval(B,tgt)*1.03;
  for(const {c,pk} of opts){
    const recv=(c.reduce((s,p)=>s+mval(B,p),0)*(c.length?needM(B,c[0],[tgt]):1))+pk.reduce((s,k)=>s+mpick(B,pv(k)),0);
    if(recv<ask)continue;
    if(mval(A,tgt)<(c.reduce((s,p)=>s+mval(A,p),0)+pk.reduce((s,k)=>s+mpick(A,pv(k)),0))*1.1)continue;
    const nA=cnt(ta)-c.length+1,nB=cnt(tb)-1+c.length;if(nA<12||nA>15||nB<12||nB>16)continue;
    const oA=c.reduce((s,p)=>s+(p.c||0),0),iA=tgt.c||0;
    if(!saleOK(ta,oA,iA)||!saleOK(tb,iA,oA))continue;
    ta.pl=ta.pl.filter(p=>!c.includes(p)).concat([tgt]);tb.pl=tb.pl.filter(p=>p!==tgt).concat(c);
    [tgt].concat(c).forEach(p=>{delete p.m});if(cnt(tb)>15)trimTeam(B);
    pk.forEach(k=>{k[3]=B});
    S.lt=S.lt||[];S.lt.unshift([S.day,A,B,c.map(p=>p.n).concat(pk.map(pickLabel)),[tgt.n]]);S.lt.length=Math.min(S.lt.length,12);
    return true;
  }
  return false;
}
/* signature d'un agent libre : certains joueurs refusent selon le niveau de l'équipe et leur rôle */

/* conseiller : pourquoi l'ordinateur accepte ou refuse */
function tradeWhy(ev){
  const out=[],ot=S.teams[tt],me=S.teams[S.me];
  if(!ev.give.length&&!ev.gpk.length||!ev.get.length&&!ev.rpk.length)return out;
  const m=teamMode(tt);
  out.push(`${TEAMS[tt][0]} ${MODE_NAME[m]} : `+(m==="titre"?"il préfère les joueurs d'expérience (29 ans et plus) aux jeunes et aux choix de draft.":m==="recon"?"il valorise les jeunes (24 ans et moins) et les choix de draft, et paie moins les vétérans de 30 ans et plus.":"il évalue surtout la note, l'âge et le contrat."));
  if(ev.topO&&ev.get.includes(ev.topO))out.push(`${ev.topO.n} est leur meilleur joueur : ils demandent une prime de 30 %.`);
  if(ev.okN&&!ev.sal){
    if(ev.r<1&&ev.ask>0){
      const gap=ev.ask-ev.recv,cand=me.pl.filter(p=>p.y>0&&!ev.give.includes(p)).map(p=>({p,v:mval(tt,p)})).filter(x=>x.v>=gap).sort((a,b)=>a.v-b.v)[0];
      out.push(cand?`Piste : ajoute ${cand.p.n} (${cand.p.o}, ${cand.p.a} ans) pour que l'échange passe.`:"Il manque beaucoup de valeur : une seule pièce ne suffira pas, essaie d'ajouter plusieurs joueurs ou un meilleur joueur.");
    }else if(ev.r>=1.6)out.push("Tu surpaies : ils accepteraient avec nettement moins. Essaie de retirer une pièce.");
    const npl=me.pl.filter(p=>!ev.give.includes(p)).concat(ev.get),b0=teamStr(me),b1=teamStr({...me,pl:npl,man:false});
    const d=b1-b0;out.push(`Effet sur ton équipe : force ${b0.toFixed(1)} → ${b1.toFixed(1)} (${d>=0?"+":""}${d.toFixed(1)}).`);
  }
  return out;
}

/* ---------- ligue sur serveur (Railway) : même origine, ligue fixe "main" ---------- */
let SRV=false;
function srvDoc(code){
  const base="/api/league/"+code;let emitted=-1;
  return {
    async get(){
      const r=await fetch(base);
      if(r.status===404)return {exists:false,data:()=>null};
      if(!r.ok)throw new Error("srv "+r.status);
      const d=await r.json();return {exists:true,data:()=>d};
    },
    async set(d){
      const r=await fetch(base,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(d)});
      if(!r.ok)throw new Error("srv "+r.status);
    },
    onSnapshot(next,err){
      let stop=false;
      const tick=async()=>{
        if(stop)return;
        try{
          const r=await fetch(base+"/rev");
          if(!r.ok)return;const j=await r.json();
          if(j.rev>emitted){const s=await this.get();if(s.exists){emitted=s.data().rev;next(s)}}
        }catch(e){}
      };
      const t=setInterval(tick,2500);
      return()=>{stop=true;clearInterval(t)};
    }
  };
}
function srvLock(code){
  return {async acquire(o){
    try{const r=await fetch("/api/league/"+code+"/lock",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({holder:o.holder,ttlMs:o.ttlMs||1500})});
      return await r.json()}catch(e){return {acquired:false}}
  }};
}

/* ---------- ligue sans compte : synchronisation via un relais public (ntfy.sh), code de ligue partagé ---------- */
let NET=false,netStat='';
const NETH="https://ntfy.sh/";
const nb64=u=>{let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const nun64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ngz(str){const st=new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"));return nb64(new Uint8Array(await new Response(st).arrayBuffer()))}
async function nungz(b){const st=new Blob([nun64(b)]).stream().pipeThrough(new DecompressionStream("gzip"));return await new Response(st).text()}
function netDoc(code){
  const url=NETH+"hgm-"+code,lsk="hardwood-lg-"+code;
  let seenT=0,pend=null,pushing=false;const parts={},dec={};let emitted=-1;
  function ingest(txt){
    txt.split("\n").forEach(l=>{
      if(!l)return;let m;try{m=JSON.parse(l)}catch(e){return}
      if(m.event!=="message")return;if(m.time>seenT)seenT=m.time;
      try{const x=JSON.parse(m.message),k=x.r+":"+x.w;(parts[k]=parts[k]||{r:x.r,n:x.n,c:{}}).c[x.i]=x.d}catch(e){}
    });
  }
  async function pull(){
    const r=await fetch(url+"/json?poll=1&since="+(seenT?seenT-2:"all"));
    if(!r.ok)throw new Error("ntfy "+r.status);
    ingest(await r.text());
  }
  async function best(){
    let bk=null;
    for(const k in parts){const p=parts[k];if(Object.keys(p.c).length!==p.n)continue;if(!bk||p.r>parts[bk].r||(p.r===parts[bk].r&&k>bk))bk=k}
    if(!bk)return null;
    if(!dec[bk]){const p=parts[bk];let s="";for(let i=0;i<p.n;i++)s+=p.c[i];dec[bk]=JSON.parse(await nungz(s))}
    return dec[bk];
  }
  function local(){try{const t=localStorage.getItem(lsk);return t?JSON.parse(t):null}catch(e){return null}}
  async function publish(d){
    const g=await ngz(JSON.stringify(d)),w=Math.random().toString(36).slice(2,8),CH=3800,n=Math.ceil(g.length/CH);
    for(let i=0;i<n;i++){
      for(let a=0;a<6;a++){
        const r=await fetch(url,{method:"POST",body:JSON.stringify({r:d.rev,w,i,n,d:g.slice(i*CH,(i+1)*CH)})});
        if(r.ok)break;
        if(r.status!==429||a===5)throw new Error("ntfy "+r.status);
        await sleep(2500+a*2500);
      }
    }
  }
  return {
    async get(){
      let rem=null;
      try{await pull();rem=await best()}catch(e){if(!local())throw e}
      const lo=local();let d=rem;
      if(lo&&(!rem||lo.rev>rem.rev)){d=lo;publish(lo).catch(()=>{})}
      return {exists:!!d,data:()=>d};
    },
    async set(d){
      try{localStorage.setItem(lsk,JSON.stringify(d))}catch(e){}
      pend=d;
      if(!pushing){
        pushing=true;
        (async()=>{
          let fails=0;
          while(pend){
            const x=pend;pend=null;
            try{await publish(x);fails=0;netStat="ok"}
            catch(e){fails++;netStat="err";if(!pend&&fails<8)pend=x;await sleep(4000*fails)}
          }
          pushing=false;
        })();
      }
    },
    acquire:async()=>({acquired:true}),
    onSnapshot(next,err){
      let stop=false;
      const tick=async()=>{
        if(stop)return;
        try{await pull();const d=await best();if(d&&d.rev!==emitted){emitted=d.rev;next({exists:true,data:()=>d})}}catch(e){}
      };
      const t=setInterval(tick,5000);
      return()=>{stop=true;clearInterval(t)};
    }
  };
}
function netUse(code){
  try{localStorage.setItem("hardwood-code",code)}catch(e){}
  LGD=netDoc(code);LKD={acquire:async()=>({acquired:true})};
}
function codeCard(){

}
